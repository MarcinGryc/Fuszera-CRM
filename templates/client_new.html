{% extends "base.html" %}

{% block content %}
<h1>Dodaj klienta</h1>

<div class="card">
    <form method="post">
        <label>Typ klienta</label>
        <select name="type" required>
            <option value="individual">Indywidualny</option>
            <option value="b2b">B2B</option>
        </select>

        <label>Imię i nazwisko / osoba kontaktowa</label>
        <input name="name" required>

        <label>Firma</label>
        <input name="company">

        <label>NIP</label>
        <input name="nip">

        <label>Email</label>
        <input name="email" type="email">

        <label>Telefon</label>
        <input name="phone">

        <label>Adres</label>
        <textarea name="address"></textarea>

        <label>Notatki</label>
        <textarea name="notes"></textarea>

        <button type="submit">Zapisz klienta</button>
    </form>
</div>
{% endblock %}
