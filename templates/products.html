{% extends "base.html" %}

{% block content %}
<h1>Produkty</h1>

<form method="get" class="card">
    <label>Szukaj produktów</label>
    <input name="q" value="{{ q or '' }}" placeholder="Nazwa, gramatura...">
    <button type="submit">Szukaj</button>
    <a class="btn" href="/products">Wyczyść</a>
</form>

<div class="card">
    <h2>Dodaj produkt</h2>

    <form method="post">
        <label>Nazwa produktu</label>
        <input name="name" required>

        <label>Gramatura</label>
        <input name="weight" placeholder="np. 250 g">

        <label>Cena</label>
        <input name="price" type="number" step="0.01" required>

        <button type="submit">Dodaj produkt</button>
    </form>
</div>

<h2>Lista produktów</h2>

<table>
    <tr>
        <th>Nazwa</th>
        <th>Gramatura</th>
        <th>Cena</th>
        <th>Akcja</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product["name"] }}</td>
        <td>{{ product["weight"] }}</td>
        <td>{{ "%.2f"|format(product["price"]) }} zł</td>
        <td>
            <form method="post" action="/products/delete/{{ product['id'] }}">
                <button class="delete" type="submit">Usuń</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<div class="export-box">
    <a class="btn" href="/products/export">Eksportuj produkty do Excela</a>
</div>

<form method="post" action="/products/import" enctype="multipart/form-data" style="margin-top: 15px;">
    <label>Import produktów z Excela</label>
    <input type="file" name="file" accept=".xlsx" required>
    <button type="submit">Importuj produkty</button>
</form>

{% endblock %}
