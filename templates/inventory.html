{% extends "base.html" %}

{% block content %}
<h1>Magazyn</h1>

<div class="card">
    <h2>Dodaj przedmiot</h2>

    <form method="post">
        <label>Nazwa</label>
        <input name="name" required>

        <label>Stan</label>
        <input name="quantity" type="number" step="0.01" required>

        <label>Jednostka</label>
        <input name="unit" placeholder="np. kg, szt, opak.">

        <label>Notatki</label>
        <textarea name="notes"></textarea>

        <button type="submit">Dodaj do magazynu</button>
    </form>
</div>

<h2>Stany magazynowe</h2>

<table>
    <tr>
        <th>Nazwa</th>
        <th>Stan</th>
        <th>Jednostka</th>
        <th>Notatki</th>
        <th>Zmień stan</th>
        <th>Akcja</th>
    </tr>

    {% for item in items %}
    <tr>
        <td>{{ item["name"] }}</td>
        <td>{{ item["quantity"] }}</td>
        <td>{{ item["unit"] }}</td>
        <td>{{ item["notes"] }}</td>
        <td>
            <form method="post" action="/inventory/update/{{ item['id'] }}">
                <input name="quantity" type="number" step="0.01" value="{{ item['quantity'] }}">
                <button type="submit">Zapisz</button>
            </form>
        </td>
        <td>
            <form method="post" action="/inventory/delete/{{ item['id'] }}">
                <button class="delete" type="submit" onclick="return confirm('Usunąć z magazynu?')">Usuń</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

<div class="export-box">
    <a class="btn" href="/inventory/export">Eksportuj magazyn do Excela</a>
</div>

<form method="post" action="/inventory/import" enctype="multipart/form-data" style="margin-top: 15px;">
    <label>Import magazynu z Excela</label>
    <input type="file" name="file" accept=".xlsx" required>
    <button type="submit">Importuj magazyn</button>
</form>

{% endblock %}
