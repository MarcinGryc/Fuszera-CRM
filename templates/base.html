<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Fuszera CRM</title>

    <style>
        :root {
            --bg: #1f1f24;
            --panel: #2b2b33;
            --panel2: #34343d;
            --text: #f4f4f5;
            --muted: #b8b8c2;
            --pink: #ffb6d9;
            --pink2: #ff8fc7;
            --danger: #ff6b6b;
            --green: #8ee6a8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        nav {
            background: #17171b;
            padding: 18px 30px;
            border-bottom: 1px solid #3a3a44;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        nav a {
            color: var(--pink);
            text-decoration: none;
            margin-right: 16px;
            font-weight: bold;
        }

        main {
            padding: 30px;
            max-width: 1250px;
            margin: auto;
        }

        h1, h2, h3 { color: var(--pink); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #3d3d48;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
        }

        .stat {
            font-size: 32px;
            font-weight: bold;
            color: var(--pink);
        }

        label {
            color: var(--muted);
            margin-top: 10px;
            display: block;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            margin: 6px 0 12px;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid #50505d;
            border-radius: 8px;
        }

        textarea { min-height: 80px; }

        button, .btn {
            background: var(--pink);
            color: #1f1f24;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .btn:hover { background: var(--pink2); }

        .delete {
            background: var(--danger);
            color: white;
        }

        .muted { color: var(--muted); }
        .income { color: var(--green); }
        .expense { color: var(--danger); }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            border-bottom: 1px solid #42424d;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #17171b;
            color: var(--pink);
        }

        .done {
            text-decoration: line-through;
            color: var(--muted);
        }

        form.inline { display: inline; }

        details summary {
            cursor: pointer;
            color: var(--pink);
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/clients">Klienci</a>
        <a href="/orders">Zamówienia</a>
        <a href="/products">Produkty</a>
        <a href="/inventory">Magazyn</a>
        <a href="/coffee-pricing">Wyceń kawę</a>
        <a href="/todo">Todo</a>
        <a href="/finances">Finanse</a>
        <a href="/logout">Wyloguj</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
