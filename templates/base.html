<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Fuszera CRM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }
        nav {
            margin-bottom: 30px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        input, textarea {
            display: block;
            width: 400px;
            max-width: 100%;
            padding: 8px;
            margin-bottom: 12px;
        }
        button {
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Start</a>
        <a href="/clients">Klienci</a>
        <a href="/clients/new">Dodaj klienta</a>
    </nav>

    {% block content %}{% endblock %}
</body>
</html>
