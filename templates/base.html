<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Fuszera CRM</title>

    <style>
        :root {
            --bg: #1f1f24;
            --panel: #2b2b33;
            --panel2: #34343d;
            --text: #f4f4f5;
            --muted: #b8b8c2;
            --pink: #ffb6d9;
            --pink2: #ff8fc7;
            --danger: #ff6b6b;
            --green: #8ee6a8;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(23, 23, 27, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 182, 217, 0.18);
            box-shadow: 0 10px 30px rgba(0,0,0,0.28);
        }

        .nav-inner {
            max-width: 1250px;
            margin: auto;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            color: var(--pink);
            font-weight: 900;
            letter-spacing: 1px;
            text-decoration: none;
            font-size: 20px;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 999px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.15s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 182, 217, 0.13);
            color: var(--pink);
        }

        .nav-links .logout {
            background: rgba(255, 182, 217, 0.16);
            color: var(--pink);
            border: 1px solid rgba(255, 182, 217, 0.25);
        }

        main {
            padding: 30px;
            max-width: 1250px;
            margin: auto;
        }

        h1, h2, h3 { color: var(--pink); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #3d3d48;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22);
        }

        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card-link:hover .card {
            border-color: rgba(255, 182, 217, 0.7);
            transform: translateY(-2px);
        }

        .stat {
            font-size: 32px;
            font-weight: bold;
            color: var(--pink);
        }

        label {
            color: var(--muted);
            margin-top: 10px;
            display: block;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            margin: 6px 0 12px;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid #50505d;
            border-radius: 8px;
        }

        textarea { min-height: 80px; }

        button, .btn {
            background: var(--pink);
            color: #1f1f24;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .btn:hover { background: var(--pink2); }

        .delete {
            background: var(--danger);
            color: white;
        }

        .muted { color: var(--muted); }
        .income { color: var(--green); }
        .expense { color: var(--danger); }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            border-bottom: 1px solid #42424d;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #17171b;
            color: var(--pink);
        }

        .done {
            text-decoration: line-through;
            color: var(--muted);
        }

        form.inline { display: inline; }

        details {
            margin-bottom: 18px;
        }

        details summary {
            cursor: pointer;
            color: var(--pink);
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            list-style: none;
        }

        details summary::before {
            content: "▸ ";
        }

        details[open] summary::before {
            content: "▾ ";
        }

        .export-box {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #3d3d48;
        }

        @media (max-width: 850px) {
            .nav-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-links {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="nav-inner">
            <a class="brand" href="/">Fuszera CRM</a>

            <div class="nav-links">
                <a href="/">Dashboard</a>
                <a href="/clients">Klienci</a>
                <a href="/orders">Zamówienia</a>
                <a href="/products">Produkty</a>
                <a href="/inventory">Magazyn</a>
                <a href="/suppliers">Dostawcy</a>
                <a href="/coffee-pricing">Wyceń kawę</a>
                <a href="/todo">Todo</a>
                <a href="/finances">Finanse</a>
                <a href="/distribution">Listy dystrybucyjne</a>
                <a href="/offers">Wyślij ofertę</a>
                <a class="logout" href="/logout">Wyloguj</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
